<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Factory</title>
  <style>
    :root {
      --accent-color: #ff00ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

    /* Tooltip overlay */
    #tooltip {
      display: none;
      position: fixed;
      background: rgba(10, 10, 26, 0.95);
      border: 2px solid var(--accent-color);
      border-radius: 4px;
      padding: 8px 12px;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent-color) 30%, transparent);
      max-width: 300px;
    }
    #tooltip .tooltip-name {
      color: #00ffff;
      font-weight: bold;
      font-size: 14px;
    }
    #tooltip .tooltip-detail {
      color: #aaa;
      margin-top: 4px;
    }
    #tooltip .tooltip-tool {
      color: var(--accent-color);
      margin-top: 2px;
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(10, 10, 26, 0.85);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px 14px;
      color: #666;
      font-family: monospace;
      font-size: 11px;
      z-index: 999;
    }
    #hud .hud-title {
      color: var(--accent-color);
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 0 8px color-mix(in srgb, var(--accent-color) 50%, transparent);
    }
    #hud .hud-stat {
      color: #00ffff;
    }

    /* Chat input */
    #chat-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }
    #chat-input {
      width: 300px;
      padding: 6px 12px;
      background: rgba(10, 10, 26, 0.9);
      border: 1px solid #444;
      border-radius: 4px;
      color: #00ffff;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    #chat-input::placeholder {
      color: #555;
    }
    #chat-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent-color) 30%, transparent);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="tooltip">
    <div class="tooltip-name"></div>
    <div class="tooltip-detail"></div>
    <div class="tooltip-tool"></div>
  </div>
  <div id="hud">
    <div class="hud-title">AGENT FACTORY</div>
    <div>Agents: <span class="hud-stat" id="hud-agents">0</span></div>
    <div>Connected: <span class="hud-stat" id="hud-connected">--</span></div>
  </div>
  <div id="chat-bar">
    <input id="chat-input" type="text" placeholder="Type /vortex..." autocomplete="off" />
  </div>
  <script type="module" src="./main.ts"></script>
  <script>
    document.getElementById('chat-input').addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      const input = e.target;
      const cmd = input.value.trim().toLowerCase();
      input.value = '';
      if (cmd === '/vortex') {
        try { await fetch('/api/vortex', { method: 'POST' }); } catch {}
      }
    });
  </script>
</body>
</html>
